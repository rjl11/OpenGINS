# A version tag (v*) builds the firmware with build.yml (all configurations,
# the SRAM check and the host tests) and publishes a GitHub release with one
# .uf2: the tractor build (single antenna, other options at their defaults)
# for AgOpenGPS / AgOpenWeb, named opengins-<tag>-AOG.uf2. Only the two
# newest releases are kept; older ones are deleted, but their tags stay.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-tractor
          path: artifacts

      - name: Name the .uf2 after the tag
        run: |
          mkdir -p release
          cp artifacts/app.uf2 "release/opengins-${TAG}-AOG.uf2"
          ls -l release

      - name: Create the release
        run: |
          gh release create "$TAG" release/*.uf2 --title "$TAG" --generate-notes --verify-tag

      - name: Keep only the two newest releases
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
          while read -r old; do
            echo "deleting release $old (the tag stays)"
            gh release delete "$old" --yes
          done
