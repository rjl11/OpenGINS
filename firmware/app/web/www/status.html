<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenGINS details</title>
<link rel="stylesheet" href="/common.css">
<style>
#age{color:var(--dim)}
#age.bad{color:var(--bad);font-weight:600}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px}
.tools .note{flex:1;min-width:180px}
.bad{color:var(--bad);font-weight:600}
.warn{color:var(--warn);font-weight:600}
.ok{color:var(--ok)}
button.on{background:var(--warnb);border-color:var(--warn);color:var(--warn)}
</style>
</head>
<body>
<header><h1>OpenGINS</h1><span id="top" class="note"></span><span id="age">connecting…</span></header>
<nav class="tabs"><a href="/">Status</a><a href="/status.html" aria-current="page">Details</a><a href="/config.html">Config</a><a href="/calib.html">Calibration</a></nav>
<div class="tools">
<button type="button" id="pause">Pause</button>
<button type="button" id="dl">Download JSON</button>
<span id="size" class="note"></span>
</div>
<main id="main" class="cards"></main>
<script src="/common.js"></script>
<script>
"use strict";
/* Every object in /status.json becomes a card, in this order, the unknown
 * ones after; its scalars are rows, nested objects indented rows. */
const ORDER=["gnss","heading","nav","position","imu","mag","baro","corrections","eth","flow","speed","pole","calib","wifi","cpu","usb_log","rx_overflows"];
const TITLES={wifi:"Wi-Fi",eth:"Ethernet (W5500)",corrections:"Corrections (RTCM)",imu:"IMU (TM210)",gnss:"GNSS",heading:"GNSS heading",baro:"Barometer (BMP581)",cpu:"CPU load",nav:"Filter (INSLIB)",mag:"Magnetometer (AHRS)",calib:"IMU calibration",rx_overflows:"UART ring overflows",position:"Position (outputs)",flow:"Optical flow",speed:"Wheel speed",pole:"Survey pole",usb_log:"USB log"};
/* Unit from the key's suffix, longest first; the suffix leaves the label. */
const UNITS=[["_mps2"," m/s²"],["_dbm"," dBm"],["_mps"," m/s"],["_rps"," rad/s"],["_deg","°"],["_pct"," %"],["_hz"," Hz"],["_ms"," ms"],["_us"," µs"],["_ns"," ns"],["_ut"," µT"],["_pa"," Pa"],["_m"," m"],["_s"," s"],["_c"," °C"],["_b"," B"]];
/* The unit's limit for one JSON document (WEB_DOC_MAX in web.h): a longer
 * one is replaced by an error, so growth must be seen before it gets there. */
const DOC_MAX=4096;
let last=0,paused=false,shown=null;
function unitOf(k){for(const [s,u] of UNITS)if(k.endsWith(s))return[k.slice(0,-s.length),u];return[k,""];}
function num(v){return Number.isInteger(v)?String(v):String(+v.toPrecision(6));}
function fmt(v,u){
  if(v===null||v===undefined)return"—";
  if(typeof v==="boolean")return v?"yes":"no";
  if(typeof v==="number")return u===" Pa"&&Math.abs(v)>=1000?(v/100).toFixed(2)+" hPa":num(v)+u;
  if(Array.isArray(v))return v.every(x=>typeof x==="number")?v.map(num).join("  ")+u:v.map(x=>fmt(x,"")).join(", ");
  return String(v);
}
function cls(k,v){
  if(k==="error")return v&&v!=="ok"?"bad":"";
  if(k==="dual_refused"||k==="imu_lost")return v?"bad":"";
  if(k==="state")return /error|fail|not_found/.test(v)?"bad":(/^(run|running|up|held)$/.test(v)?"ok":"");
  return"";
}
function dur(s){const h=Math.floor(s/3600),m=Math.floor(s/60)%60;return h?h+" h "+m+" min":m?m+" min "+s%60+" s":s+" s";}
/* Rows of one card: [path, label, text, class, depth]. A nested object gets
 * a heading row, its entries indented under it. */
function rows(obj,prefix,out,depth){
  depth=depth||0;
  for(const [k,v] of Object.entries(obj)){
    if(v!==null&&typeof v==="object"&&!Array.isArray(v)){
      out.push([prefix+k+"/",k.replace(/_/g," "),"","",depth]);
      rows(v,prefix+k+"/",out,depth+1);
      continue;
    }
    const [name,u]=unitOf(k);
    out.push([prefix+k,name.replace(/_/g," "),fmt(v,u),cls(k,v),depth]);
  }
  return out;
}
/* Cells are rewritten in place, and only when their text changes, so text
 * can be selected and copied while the page updates. A card is rebuilt only
 * when its set of rows changes. */
const cards=new Map();
function render(d){
  const m=document.getElementById("main");
  const keys=Object.keys(d).filter(k=>d[k]!==null&&typeof d[k]==="object"&&!Array.isArray(d[k]));
  keys.sort((a,b)=>{const x=ORDER.indexOf(a),y=ORDER.indexOf(b);return(x<0?99:x)-(y<0?99:y);});
  for(const [k,c] of cards)if(!keys.includes(k)){c.sec.remove();cards.delete(k);}
  keys.forEach((k,idx)=>{
    const r=rows(d[k],"",[]),sig=r.map(x=>x[0]).join("|");
    let c=cards.get(k);
    if(!c||c.sig!==sig){
      const sec=document.createElement("section"),h=document.createElement("h2"),t=document.createElement("table");
      h.textContent=TITLES[k]||k.replace(/_/g," ");
      sec.append(h,t);
      const cells=r.map(([,label,,,depth])=>{const tr=t.insertRow(),a=tr.insertCell();a.textContent=label;if(depth)a.style.paddingLeft=12*depth+"px";return tr.insertCell();});
      if(c)c.sec.replaceWith(sec);
      c={sec,sig,cells};cards.set(k,c);
    }
    /* Moved only when out of place: moving a node drops a selection in it. */
    if(m.children[idx]!==c.sec)m.insertBefore(c.sec,m.children[idx]||null);
    r.forEach(([,,text,cl],i)=>{const td=c.cells[i];if(td.textContent!==text)td.textContent=text;if(td.className!==cl)td.className=cl;});
  });
  const top=[d.fw&&d.fw+(d.fw_date?" ("+d.fw_date+")":""),d.platform,typeof d.uptime_s==="number"?"up "+dur(d.uptime_s):null,d.reset&&"last reset: "+d.reset].filter(Boolean);
  document.getElementById("top").textContent=top.join(" · ");
  const b=d.$bytes,s=document.getElementById("size");
  if(b){s.textContent="status.json "+(b/1024).toFixed(1)+" of "+(DOC_MAX/1024).toFixed(0)+" KB";s.className="note"+(b>0.9*DOC_MAX?" bad":b>0.8*DOC_MAX?" warn":"");}
}
function age(){
  const a=document.getElementById("age");
  const s=last?(Date.now()-last)/1000:Infinity;
  a.textContent=paused?"paused":last?(s<2.5?"live":"no update for "+Math.round(s)+" s"):"connecting…";
  a.className=paused||s<2.5?"":"bad";
}
OG.poll(async()=>{if(paused)return;const d=await OG.getJson("/status.json");last=Date.now();shown=d;render(d);age();},1000);
setInterval(age,500);
const pb=document.getElementById("pause");
pb.addEventListener("click",()=>{paused=!paused;pb.textContent=paused?"Resume":"Pause";pb.classList.toggle("on",paused);if(!paused)last=0;age();});
/* One file with all three documents, for bench and field reports. While
 * paused, the status is the one on screen. */
document.getElementById("dl").addEventListener("click",async()=>{
  const b=document.getElementById("dl");
  b.disabled=true;b.textContent="Reading…";
  const snap={saved:new Date().toISOString(),page:location.href};
  try{snap.status=paused&&shown?shown:await OG.getJson("/status.json");}catch(e){snap.status_error=e.message;}
  for(const k of ["config","calib"]){try{snap[k]=await OG.getJson("/"+k+".json");}catch(e){snap[k+"_error"]=e.message;}}
  snap.bytes={};
  for(const k of ["status","config","calib"])if(snap[k]&&snap[k].$bytes)snap.bytes[k]=snap[k].$bytes;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(snap,null,1)],{type:"application/json"}));
  a.download="opengins-"+snap.saved.replace(/[-:]/g,"").replace("T","-").slice(0,15)+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  b.disabled=false;b.textContent="Download JSON";
});
</script>
</body>
</html>
